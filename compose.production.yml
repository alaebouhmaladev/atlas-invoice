services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: atlas_facturation_app
    restart: always
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      - SESSION_SECRET=${SESSION_SECRET}
      - SESSION_MAX_AGE=${SESSION_MAX_AGE:-86400}
      - APP_URL=${APP_URL:-https://facturation.atlasbites-maroc.com}
      - BACKUP_DIR=/app/backups
    volumes:
      - atlas_prod_uploads:/app/server/uploads
      - atlas_prod_backups:/app/backups
    depends_on:
      db:
        condition: service_healthy
    networks:
      - atlas_prod_network
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "require(''http'').get(''http://localhost:3000/api/health/live'', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on(''error'', () => process.exit(1));"'
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  db:
    image: postgres:16-alpine
    container_name: atlas_facturation_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Security: Database port 5432 is isolated inside atlas_prod_network and NOT exposed to external host interfaces
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - atlas_prod_network

networks:
  atlas_prod_network:
    driver: bridge
    internal: false

volumes:
  postgres_prod_data:
    driver: local
  atlas_prod_uploads:
    driver: local
  atlas_prod_backups:
    driver: local
