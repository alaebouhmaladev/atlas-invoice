# ==============================================================================
# Atlas Bites CRM & Facturation — Production Nginx Reverse Proxy Configuration
# ==============================================================================

upstream atlas_app_backend {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# 1. HTTP Server — Redirect all HTTP traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name facturation.atlasbites-maroc.com crm.atlasbites-maroc.com;

    # Let's Encrypt Certbot ACME Challenge Path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server — Secure Reverse Proxy
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name facturation.atlasbites-maroc.com crm.atlasbites-maroc.com;

    # TLS Certificates (Managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/facturation.atlasbites-maroc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/facturation.atlasbites-maroc.com/privkey.pem;

    # Strong TLS Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Request Body Size Limit for Company Logo & Asset Uploads
    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self';" always;

    # Security: Block public access to sensitive system files, environment & backup archives
    location ~ /\.(env|git|htaccess|docker) {
        deny all;
        return 404;
    }

    location ~ \.(dump|sql|tar\.gz|bak|log)$ {
        deny all;
        return 404;
    }

    location /backups/ {
        deny all;
        return 404;
    }

    # Reverse Proxy to Nuxt Nitro Server
    location / {
        proxy_pass http://atlas_app_backend;
        proxy_http_version 1.1;

        # Header Forwarding
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket Upgrade Support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
